<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" fill="none">
  <defs>
    <linearGradient id="bgrad" x1="0" y1="0" x2="880" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a26"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#BC8CFF"/>
      <stop offset="1" stop-color="#FF7B72"/>
      <animate attributeName="x1" values="-1;0.5;-1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.5;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#BC8CFF"/>
      <stop offset="1" stop-color="#FF7B72"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="876" height="196" rx="22" fill="url(#bgrad)" stroke="url(#ring)" stroke-width="2"/>

  <!-- partículas flotantes -->
  <g opacity="0.8">
    <circle cx="90" cy="46" r="2.5" fill="#58A6FF">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="46;34;46" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="52" r="3" fill="#BC8CFF">
      <animate attributeName="opacity" values="1;0.15;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="52;66;52" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="150" r="2" fill="#FF7B72">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="140" r="2.5" fill="#58A6FF">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="34" r="2" fill="#BC8CFF">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="168" r="2" fill="#58A6FF">
      <animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="590" cy="170" r="2.5" fill="#FF7B72">
      <animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- símbolos de código flotantes -->
  <text x="70" y="112" font-family="Consolas, Menlo, monospace" font-size="26" fill="#1f6feb" opacity="0.55">
    &lt;/&gt;
    <animate attributeName="opacity" values="0.25;0.6;0.25" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="780" y="118" font-family="Consolas, Menlo, monospace" font-size="24" fill="#d2a8ff" opacity="0.5">
    { }
    <animate attributeName="opacity" values="0.55;0.2;0.55" dur="5.5s" repeatCount="indefinite"/>
  </text>

  <!-- nombre -->
  <text x="440" y="92" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="54" font-weight="800" fill="url(#txt)" letter-spacing="4">
    IROENNYS
    <animate attributeName="opacity" values="0.86;1;0.86" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- subtitulo -->
  <text x="440" y="128" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="16" font-weight="600" fill="#8b949e" letter-spacing="3">
    BOT DEVELOPER  ·  AI AGENTS  ·  AUTOMATION
  </text>

  <!-- cursor -->
  <rect x="636" y="70" width="4" height="30" rx="2" fill="#58A6FF">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- linea de acento inferior -->
  <line x1="320" y1="152" x2="560" y2="152" stroke="url(#ring)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.4s" repeatCount="indefinite"/>
  </line>
</svg>
