<svg xmlns="http://www.w3.org/2000/svg" width="800" height="24" viewBox="0 0 800 24">
  <defs>
    <linearGradient id="lin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#BC8CFF"/>
      <stop offset="1" stop-color="#FF7B72"/>
    </linearGradient>
  </defs>
  <line x1="20" y1="12" x2="780" y2="12" stroke="#21262d" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="12" x2="780" y2="12" stroke="url(#lin)" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 18">
    <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="1.6s" repeatCount="indefinite"/>
  </line>
  <circle cy="12" r="4.5" fill="#58A6FF">
    <animate attributeName="cx" values="20;780;20" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#58A6FF;#BC8CFF;#FF7B72;#58A6FF" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
