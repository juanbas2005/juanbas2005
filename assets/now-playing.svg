<svg xmlns="http://www.w3.org/2000/svg" width="640" height="128" viewBox="0 0 640 128">
  <rect x="0.5" y="0.5" width="639" height="127" rx="16" fill="#0d1117" stroke="#1f2937"/>

  <!-- vinilo girando -->
  <g transform="translate(66,64)">
    <g>
      <circle r="44" fill="#111827" stroke="#1db954" stroke-width="2"/>
      <circle r="33" fill="none" stroke="#374151" stroke-width="1.5"/>
      <circle r="23" fill="none" stroke="#374151" stroke-width="1.5"/>
      <circle r="13" fill="#1db954"/>
      <circle r="4" fill="#0d1117"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- badge EN VIVO -->
  <rect x="540" y="12" width="86" height="22" rx="11" fill="#1db954"/>
  <circle cx="554" cy="23" r="3.5" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.1;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="563" y="27" font-family="Verdana, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#052e0b">EN VIVO</text>

  <!-- canciones rotativas (ciclo de 18s) -->
  <text x="132" y="52" font-family="Verdana, Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">
    🎵 Eye of the Tiger
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.33;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="132" y="52" font-family="Verdana, Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">
    🎵 Lose Yourself
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.62;0.66;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="132" y="52" font-family="Verdana, Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">
    🎵 Till I Collapse
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.70;0.97;1" dur="18s" repeatCount="indefinite"/>
  </text>

  <!-- artistas rotativas en sincronía -->
  <text x="132" y="74" font-family="Verdana, Segoe UI, sans-serif" font-size="13" fill="#9ca3af">
    Survivor · Playlist Gym 🔥
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.33;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="132" y="74" font-family="Verdana, Segoe UI, sans-serif" font-size="13" fill="#9ca3af">
    Eminem · Playlist Gym 🔥
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.62;0.66;1" dur="18s" repeatCount="indefinite"/>
  </text>
  <text x="132" y="74" font-family="Verdana, Segoe UI, sans-serif" font-size="13" fill="#9ca3af">
    Eminem · Playlist Gym 🔥
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.70;0.97;1" dur="18s" repeatCount="indefinite"/>
  </text>

  <!-- barra de progreso -->
  <rect x="132" y="94" width="400" height="5" rx="2.5" fill="#1f2937"/>
  <rect x="132" y="94" width="120" height="5" rx="2.5" fill="#1db954">
    <animate attributeName="width" values="0;130;260;400" keyTimes="0;0.33;0.66;1" dur="18s" repeatCount="indefinite"/>
  </rect>

  <!-- ecualizador animado -->
  <g fill="#1db954">
    <rect x="548" width="10" rx="4">
      <animate attributeName="height" values="12;40;20;36;12" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="98;70;90;74;98" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="562" width="10" rx="4">
      <animate attributeName="height" values="30;10;34;16;30" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="80;100;76;94;80" dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="576" width="10" rx="4">
      <animate attributeName="height" values="18;38;14;28;18" dur="0.65s" repeatCount="indefinite"/>
      <animate attributeName="y" values="92;72;96;82;92" dur="0.65s" repeatCount="indefinite"/>
    </rect>
    <rect x="590" width="10" rx="4">
      <animate attributeName="height" values="34;14;30;40;34" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="76;96;80;70;76" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="604" width="10" rx="4">
      <animate attributeName="height" values="10;26;38;18;10" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="100;84;72;92;100" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
